<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension preview</title>
    <style>
      html, body { margin: 0; height: 100%; }
      .frame { display: flex; height: 100vh; }
      .frame iframe { flex: 1; border: 0; }
      #panel { width: 400px; border-left: 1px solid #e8e8e8; overflow-y: auto; }
      body[data-view="panel"] iframe, body[data-view="panel"] #chat, body[data-view="page"] #panel { display: none; }
      body[data-view="panel"] #panel { width: 100%; border: 0; }
    </style>
  </head>
  <body>
    <div class="frame">
      <iframe src="http://localhost:5500/board.html" title="Foresight board (mock)"></iframe>
      <div id="panel"></div>
    </div>
    <div id="chat"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
